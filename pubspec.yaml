name: andys_grocery_list
description: "A Markdown-backed TODO and grocery list app."
publish_to: 'none'

# name+code: the name is Android's versionName, the code its versionCode.
# Raise the code with every release.
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  decimal: ^3.2.6
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  super_sliver_list: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
